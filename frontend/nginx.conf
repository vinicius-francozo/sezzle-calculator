# Serves the built SPA and reverse-proxies the API, so the browser talks to a
# single origin and CORS never enters the picture (DESIGN.md D14).
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The backend already serves the /api prefix, so it is forwarded untouched:
    # no trailing slash on proxy_pass, no rewrite.
    location /api/ {
        proxy_pass       http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets are immutable; the entry document never is.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
