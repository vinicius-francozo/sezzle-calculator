# Serves the built SPA and reverse-proxies the API, so the browser talks to a
# single origin and CORS never enters the picture (DESIGN.md D13).
server {
    # 8080 rather than 80: the image runs nginx as an unprivileged user, which
    # cannot bind a port below 1024. Compose publishes it on the host.
    listen      8080;
    server_name _;

    # Trailing-slash redirects must be relative. nginx builds an absolute
    # Location from the port it listens on, 8080, not the 3000 Compose
    # publishes, so GET /api would answer 301 to http://localhost:8080/api/ --
    # a natively run backend, which is the very collision the 3000/8080 split
    # exists to prevent.
    absolute_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    # Whether the body is compressed depends on the request, so caches must key
    # on Accept-Encoding rather than serve a gzipped copy to a client that
    # cannot read one.
    gzip_vary       on;

    # The backend already serves the /api prefix, so the request is forwarded
    # untouched: $request_uri is the original path and query, and there is no
    # rewrite.
    #
    # The upstream is reached through a variable on purpose. Written as a
    # literal, nginx resolves the name once while loading the configuration and
    # keeps that address for the life of the worker, so a backend that restarts
    # on a different IP is proxied to the old one until nginx is reloaded. A
    # variable defers the lookup to request time, against Docker's embedded DNS.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://backend:8080;

        proxy_pass       $upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset file names carry a content hash, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry document must not be, or a returning browser keeps a copy that
    # references bundle hashes the redeploy has already removed, and every
    # reload serves the same broken page from cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
