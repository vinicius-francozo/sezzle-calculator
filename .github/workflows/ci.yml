name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race ./... -coverprofile=coverage.out

      - name: Report coverage
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo 'No coverage profile: the tests did not get far enough to write one.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report=$(go tool cover -func=coverage.out)
          echo "$report"
          {
            echo '### Backend coverage'
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce the coverage floor
        run: |
          floor=97.0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $NF }' | tr -d '%')
          if awk -v total="$total" -v floor="$floor" 'BEGIN { exit !(total < floor) }'; then
            echo "::error::backend coverage is ${total}%, below the floor of ${floor}%"
            exit 1
          fi
          echo "backend coverage is ${total}%, at or above the floor of ${floor}%"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Report coverage
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo 'No coverage summary: the tests did not get far enough to write one.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary=$(jq -r '.total | "- statements: \(.statements.pct)%",
                                    "- branches: \(.branches.pct)%",
                                    "- functions: \(.functions.pct)%",
                                    "- lines: \(.lines.pct)%"' coverage/coverage-summary.json)
          echo "$summary"
          {
            echo '### Frontend coverage'
            echo
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

  stack:
    name: Stack (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Wait for the proxy to accept connections
        run: |
          curl --silent --show-error --fail --output /dev/null \
            --retry 3 --retry-connrefused --retry-delay 1 \
            http://localhost:3000/

      - name: Exercise the API through the proxy
        run: ./scripts/smoke-test.sh

      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down --volumes
