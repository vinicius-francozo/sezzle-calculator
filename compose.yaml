name: sezzle-calculator

services:
  backend:
    build: ./backend
    healthcheck:
      test:
        - CMD
        - /usr/bin/busybox
        - sh
        - -c
        - /usr/bin/busybox wget -q -O /dev/null "http://127.0.0.1:$${PORT}/api/v1/health"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
